<!-- CTU — bloqueos de marca. Copiar el bloque que corresponda.
     El sol va como <img> con el archivo -ink o -mist segun el fondo; si se incrusta
     el SVG en linea, usar el archivo sin sufijo y hereda la tinta del texto. -->
<!-- Fuentes y hoja de estilo -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/logo/ctu-logo.css">

<!-- Iconos de sitio -->
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/logo/favicon-180.png">

<!-- 1. Vertical extendida — desde 104 px de alto. Portada, pie de pagina, documentos. -->
<div class="ctu-logo" style="font-size: 44px;">
  <span class="ctu-logo__sun" aria-hidden="true"><img src="assets/logo/ctu-sol-16-ink.svg" alt=""></span>
  <span class="ctu-logo__sigla">CTU</span>
  <span class="ctu-logo__name">FORO FEDERAL</span>
  <span class="ctu-logo__rule" aria-hidden="true"></span>
  <span class="ctu-logo__tag">Ciencia &middot; Tecnolog&iacute;a &middot; Universidad</span>
</div>

<!-- 2. Vertical — desde 72 px de alto. Tarjetas, placas, redes. -->
<div class="ctu-logo" style="font-size: 40px;">
  <span class="ctu-logo__sun" aria-hidden="true"><img src="assets/logo/ctu-sol-16-ink.svg" alt=""></span>
  <span class="ctu-logo__sigla">CTU</span>
  <span class="ctu-logo__name">FORO FEDERAL</span>
</div>

<!-- 3. Horizontal — desde 40 px de alto. Barra de navegacion. -->
<a class="ctu-logo ctu-logo--horizontal" href="/" style="font-size: 22px; text-decoration: none;">
  <span class="ctu-logo__sun" aria-hidden="true"><img src="assets/logo/ctu-sol-16-ink.svg" alt=""></span>
  <span class="ctu-logo__text">
    <span class="ctu-logo__sigla">CTU</span>
    <span class="ctu-logo__name">FORO FEDERAL</span>
  </span>
</a>

<!-- 4. Isotipo y placa — cualquier tamano. Avatar, app icon, sello. -->
<span class="ctu-mark" style="width: 40px; height: 40px;" role="img" aria-label="CTU Foro Federal"><img src="assets/logo/ctu-sol-16-ink.svg" alt=""></span>

<span class="ctu-tile">
  <span class="ctu-mark" aria-hidden="true"><img src="assets/logo/ctu-sol-16-mist.svg" alt=""></span>
</span>
